name: Android build

on:
  push:
    branches: [ "main", "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEBDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ad-block engine and filter lists
        run: |
          if [ -f tools/adblock/package.json ]; then
            cd tools/adblock
            npm ci --no-audit --no-fund
            node build.mjs --out ../../app/src/main/assets/adblock
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.WEBDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            echo "Signing with release key"
          else
            echo "::warning::WEBDROID_KEYSTORE_B64 secret is not set; APK is signed with a throwaway debug key"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to publish a release without the release signing key"
              exit 1
            fi
          fi

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "WEBDROID_VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="WebDroid-${WEBDROID_VERSION_NAME:-dev-$(git rev-parse --short HEAD)}.apk"
          cp "$SRC" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=$(mktemp)
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            cp "release-notes/${GITHUB_REF_NAME}.md" "$NOTES_FILE"
          else
            git log -1 --pretty=%B > "$NOTES_FILE"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "WebDroid ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            --latest
