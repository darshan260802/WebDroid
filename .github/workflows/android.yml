name: Android build

on:
  push:
    branches: [ "main", "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEBDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ad-block engine and filter lists
        run: |
          if [ -f tools/adblock/package.json ]; then
            cd tools/adblock
            npm ci --no-audit --no-fund
            node build.mjs --out ../../app/src/main/assets/adblock
            node test.mjs ../../app/src/main/assets/adblock
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpncore/go.mod
          cache-dependency-path: tools/vpncore/go.sum

      - name: Test and build the VPN core (gomobile)
        shell: bash
        run: |
          cd tools/vpncore
          go test ./...
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          echo "Using NDK at $ANDROID_NDK_HOME"
          ./build.sh

      - name: Bundle Tor GeoIP data (exit country selection)
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tor
          if sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tor-geoipdb && [ -s /usr/share/tor/geoip ]; then
            cp /usr/share/tor/geoip /usr/share/tor/geoip6 app/src/main/assets/tor/
          else
            curl -fsSL -o app/src/main/assets/tor/geoip https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip
            curl -fsSL -o app/src/main/assets/tor/geoip6 https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip6
          fi
          ls -la app/src/main/assets/tor

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.WEBDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            echo "Signing with release key"
          else
            echo "::warning::WEBDROID_KEYSTORE_B64 secret is not set; APK is signed with a throwaway debug key"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to publish a release without the release signing key"
              exit 1
            fi
          fi

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat VERSION)"
          fi
          echo "WEBDROID_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Assemble release APK
        shell: bash
        run: ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle-build.log

      - name: Summarise build errors
        if: failure()
        shell: bash
        run: |
          echo "==== WebDroid build errors ===="
          grep -E "^e: |error:|What went wrong|FAILED" -A3 gradle-build.log | grep -v "^--$" | head -200 || true

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="WebDroid-v${WEBDROID_VERSION_NAME}.apk"
          cp "$SRC" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # OTA manifest: installed apps read releases/latest/download/update.json.
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE=$(mktemp)
            git log -1 --pretty=%B > "$NOTES_FILE"
          fi
          cp "$NOTES_FILE" dist/release-notes.md
          VERSION_CODE=$(git rev-list --count HEAD) \
          APK="dist/$NAME" NOTES="$NOTES_FILE" \
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${NAME}" \
          python3 - <<'PY'
          import hashlib, json, os, datetime
          apk = os.environ["APK"]
          sha = hashlib.sha256(open(apk, "rb").read()).hexdigest()
          info = {
              "versionName": os.environ["WEBDROID_VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "tag": os.environ["RELEASE_TAG"],
              "apkUrl": os.environ["APK_URL"],
              "size": os.path.getsize(apk),
              "sha256": sha,
              "minSdk": 26,
              "notes": open(os.environ["NOTES"], encoding="utf-8").read().strip(),
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(info, open("dist/update.json", "w"), indent=2)
          print(json.dumps({k: v for k, v in info.items() if k != "notes"}, indent=2))
          PY
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            dist/*.apk
            dist/update.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_type == 'branch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish"
            exit 0
          fi
          if [ -z "${KEYSTORE_PRESENT:-}" ] && [ ! -f keystore/release.jks ]; then
            echo "::warning::Not publishing $RELEASE_TAG without the release signing key"
            exit 0
          fi
          # update.json makes every release an OTA update for installed apps.
          gh release create "$RELEASE_TAG" dist/*.apk dist/update.json \
            --target "$GITHUB_SHA" \
            --title "WebDroid ${RELEASE_TAG}" \
            --notes-file dist/release-notes.md \
            --latest
